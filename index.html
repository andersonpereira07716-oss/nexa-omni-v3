<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXA v3.6 Security 10/10</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #030712; color: #f3f4f6; font-family: monospace; margin: 0; padding: 12px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        button { background: #00ffcc; color: #030712; border: none; padding: 8px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #00b38f; }
        input, textarea { background: #1f2937; border: 1px solid #374151; color: #fff; padding: 8px; width: 100%; border-radius: 4px; box-sizing: border-box; margin-bottom: 8px; }
        .message { margin-bottom: 8px; padding: 8px; border-radius: 4px; max-width: 85%; word-break: break-word; }
        .message.user { margin-left: auto; background: #00ffcc; color: #030712; }
        .message.ai { margin-right: auto; background: #1f2937; color: #f3f4f6; border-left: 3px solid #00ffcc; }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2 style="margin:0; font-size:18px; color:#00ffcc;">NEXA v3.6 SECURE</h2>
        <span id="auth-status" style="font-size: 11px; color: #9ca3af;">A verificar...</span>
    </div>

    <!-- AUTH CARD -->
    <div id="auth-card" class="card" style="display:none;">
        <h3 style="margin-top:0; font-size:14px; color:#00ffcc;">🔒 Acesso Seguro (Auth Ativo)</h3>
        <input type="email" id="auth-email" placeholder="Email">
        <input type="password" id="auth-password" placeholder="Palavra-passe">
        <div style="display: flex; gap: 8px;">
            <button onclick="handleLogin()" style="flex:1;">Entrar</button>
            <button onclick="handleSignUp()" style="flex:1; background:#3b82f6; color:#fff;">Registar</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-container" style="display:none;">
        <div class="card">
            <h3 style="margin-top:0; font-size:14px; color:#00ffcc;">🤖 TERMINAL BLINDADO (AES Key Store)</h3>
            <input type="password" id="gemini-key" placeholder="Chave API Gemini (Criptografada localmente)">
            <button onclick="saveApiKeySecure()" style="width:100%; margin-bottom:8px;">Salvar Chave Segura</button>
            <div id="chat-messages" style="height:160px; overflow-y:auto; background:#030712; padding:8px; border-radius:4px; margin-bottom:8px; border:1px solid #1f2937;"></div>
            <textarea id="user-input" rows="2" placeholder="Digite comando (/kdp, /zap, /task)..."></textarea>
            <button onclick="sendGeminiMessage()" style="width:100%;">Executar Comando Seguro</button>
        </div>

        <div class="card">
            <h3 style="margin-top:0; font-size:14px; color:#00ffcc;">📋 KANBAN TÁTICO SEGURO</h3>
            <div style="margin-bottom:8px; display:flex; gap:4px;">
                <input type="text" id="new-task-title" placeholder="Nova tarefa..." style="margin-bottom:0;">
                <button onclick="createTask()">Adicionar</button>
            </div>
            <div style="display:grid; grid-template-columns:1fr; gap:8px;">
                <div style="background:#030712; padding:8px; border-radius:4px;"><b style="font-size:12px; color:#3b82f6;">A Fazer:</b><div id="list-todo" style="margin-top:4px;"></div></div>
                <div style="background:#030712; padding:8px; border-radius:4px;"><b style="font-size:12px; color:#eab308;">Em Progresso:</b><div id="list-in_progress" style="margin-top:4px;"></div></div>
                <div style="background:#030712; padding:8px; border-radius:4px;"><b style="font-size:12px; color:#10b981;">Concluído:</b><div id="list-done" style="margin-top:4px;"></div></div>
            </div>
        </div>

        <div class="card">
            <h3 style="margin-top:0; font-size:14px; color:#00ffcc;">🛡️ SEGURANÇA & STATUS 10/10</h3>
            <button onclick="checkSecurityStatus()" style="width:100%; margin-bottom:6px; background:#10b981; color:#030712;">Verificar Auditoria RLS & AES</button>
            <textarea id="util-output" rows="2" readonly style="margin-top:8px; font-size:11px; background:#030712;" placeholder="Estado de segurança..."></textarea>
            <button onclick="handleLogout()" style="width:100%; margin-top:8px; background:#ef4444; color:#fff;">Terminar Sessão</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
