<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXA v3.2 Enterprise - Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #030712; color: #f3f4f6; font-family: monospace; margin: 0; padding: 12px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        button { background: #00ffcc; color: #030712; border: none; padding: 8px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #00b38f; }
        input, textarea, select { background: #1f2937; border: 1px solid #374151; color: #fff; padding: 8px; width: 100%; border-radius: 4px; box-sizing: border-box; margin-bottom: 8px; }
        .message { margin-bottom: 8px; padding: 8px; border-radius: 4px; max-width: 85%; word-break: break-word; }
        .message.user { margin-left: auto; background: #00ffcc; color: #030712; }
        .message.ai { margin-right: auto; background: #1f2937; color: #f3f4f6; border-left: 3px solid #00ffcc; }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2 style="margin:0; font-size:18px; color:#00ffcc;">NEXA v3.2 ENTERPRISE</h2>
        <span id="auth-status" style="font-size: 12px; color: #9ca3af;">Ativo</span>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app-container">
        <!-- 1. TERMINAL IA (STREAMING) -->
        <div class="card">
            <h3 style="margin-top:0; font-size:14px; color:#00ffcc;">🤖 TERMINAL IA & STREAMING</h3>
            <input type="password" id="gemini-key" placeholder="Chave API Gemini">
            <button onclick="saveApiKey()" style="width:100%; margin-bottom:8px;">Salvar Chave</button>
            <div id="chat-messages" style="height:200px; overflow-y:auto; background:#030712; padding:8px; border-radius:4px; margin-bottom:8px; border:1px solid #1f2937;"></div>
            <textarea id="user-input" rows="2" placeholder="Digite seu comando para a IA..."></textarea>
            <button onclick="sendGeminiMessage()" style="width:100%;">Enviar Comando</button>
        </div>

        <!-- 2. KANBAN TÁTICO -->
        <div class="card">
            <h3 style="margin-top:0; font-size:14px; color:#00ffcc;">📋 KANBAN TÁTICO DINÂMICO</h3>
            <div style="margin-bottom:8px; display:flex; gap:4px;">
                <input type="text" id="new-task-title" placeholder="Nova tarefa..." style="margin-bottom:0;">
                <button onclick="createTask()">Adicionar</button>
            </div>
            <div style="display:grid; grid-template-columns:1fr; gap:8px;">
                <div style="background:#030712; padding:8px; border-radius:4px;"><b style="font-size:12px; color:#3b82f6;">A Fazer:</b><div id="list-todo" style="margin-top:4px;"></div></div>
                <div style="background:#030712; padding:8px; border-radius:4px;"><b style="font-size:12px; color:#eab308;">Em Progresso:</b><div id="list-in_progress" style="margin-top:4px;"></div></div>
                <div style="background:#030712; padding:8px; border-radius:4px;"><b style="font-size:12px; color:#10b981;">Concluído:</b><div id="list-done" style="margin-top:4px;"></div></div>
            </div>
        </div>

        <!-- 3. MÓDULO DE AUTOMAÇÃO WHATSAPP & KDP TOOLS -->
        <div class="card">
            <h3 style="margin-top:0; font-size:14px; color:#00ffcc;">⚙️ UTILS: WHATSAPP & KDP PYTHON</h3>
            <p style="font-size:11px; color:#9ca3af; margin-top:0;">Gere comandos e gere scripts para o Termux / PM2.</p>
            <button onclick="generatePythonKdpScript()" style="width:100%; margin-bottom:6px; background:#3b82f6; color:#fff;">Gerar Script Python KDP (ReportLab)</button>
            <button onclick="generatePm2WhatsappScript()" style="width:100%; background:#8b5cf6; color:#fff;">Gerar Config PM2 WhatsApp Bot</button>
            <textarea id="util-output" rows="3" readonly style="margin-top:8px; font-size:11px; background:#030712;" placeholder="Output dos utilitários..."></textarea>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
